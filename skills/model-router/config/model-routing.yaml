    - item: "Fable 5 provider-side model substitution (security/biology)"
      status: verified
      probed_on: 2026-08-19
      evidence: >
        Vendor documentation (not an execution probe): Fable 5 requests can
        be substituted to another Claude model via the refusal-fallback
        mechanism — cybersecurity to Opus 4.8, biology to Opus 5. The
        substitution is conditional on the calling surface: default on
        claude.ai, opt-in fallback configuration on the raw API (without it
        a refused request stops), and harness-dependent for this router's
        `claude -p` transport. Implication: under security_sensitive the
        identity of a claude_architect seat is declared_only, and the
        substitute (Opus 4.8) may not be in this registry.
        `served_model_caveats` on claude_architect discloses this per route.

