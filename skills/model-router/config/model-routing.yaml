        list leaves it out. A project name the CLI cannot resolve runs silently
        in its default project ("no grants for project \"CLI Project\",
        cleared project permissions", exit 0). The agent's `tools` allow-list
        removed every tool but view_file and manage_task (agy-ag1, then
        gcontain-rel); an unknown agent name exits 1. The CLI does not
        rewrite the project or agent file (same bytes and inode after a run).

