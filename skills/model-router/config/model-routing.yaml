    price_per_mtok:
      verified_on: "2026-10-27"
      max_age_days: 30
      source: "https://ai.google.dev/gemini-api/docs/pricing"
      input: 2.00
      output: 10.00
      cached_input: 0.10
    context_window: 1048576

  # Retired 1.24.0 (user instruction 2026-10-27: remove Gemini 3.8 Flash from
