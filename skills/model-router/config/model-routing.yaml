    - item: "muse-exec-jsonl-v1 envelope shape (dispatch_agent --output-envelope)"
      status: verified
      probed_on: "2026-10-13"
      cli_version: "Muse Code 1.4.7 (1.4.7-R6101.1)"
      evidence: >
        `muse exec --json` writes one JSON event per line, each named by
        payload_type. A turn ends in exactly one run.terminal.* event:
        run.terminal.completed (exit 0) carries the final answer in
        payload.text; run.terminal.failed (exit 1) carries payload.reason.
        mfail-final (an id the account cannot use, released supervisor)
        graded FAILED with envelope error_type run.terminal.failed and an
        error_reason holding the provider's "does not exist or you lack
        access" text and request id (receipt sha256
        bda73c280b0aa32021b15baf93cbe653bcf8f9a564e7fdd6414f18141cc6968d); the
        earlier mfail ran before those fields existed. The
        stream carries the prompt (run.lifecycle.started), the answer streamed
        as run.output.delta chunks of about 27 characters, every tool result,
        and no token counts and no served-model record; run.model.configured
        echoes the requested id. The JSON is not ASCII-escaped, so a line
        separator inside a string stays raw: lines are split on newline only.
        The test fixtures under tests/fixtures/muse/ are two of these
        captures with local paths scrubbed. validate_observation accepts a
        completed stream of this format; it still refuses the two codex
        formats as success evidence, as it did before this format existed.

