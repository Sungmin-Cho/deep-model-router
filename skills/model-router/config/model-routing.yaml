  # The id moved 4.6 -> 4.7 on 2026-09-22, the day grok-4.7 was observed as
  # the CLI's default model. What carries over and what does not is recorded
  # in the ledger: the effort ceiling was re-PROBED on 4.7, and the prices and
  # window were re-READ from published documentation — identical either way,
  # so the price half of the worker_balanced binding still holds. The quality
  # head-to-head was run on 4.6 and has NOT been re-run, so `capability_tier`
