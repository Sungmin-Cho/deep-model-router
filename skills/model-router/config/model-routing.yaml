        the same test, test_extends.py::test_absolute_entry). SUCCEEDED wall
        p50 (TERMINATION_UNCONFIRMED excluded): sonnet 122s (n=17) vs grok
        150s (n=13). Per type sonnet p50 < grok p50 (multi-file 223 vs 368,
        debugging 102 vs 143, refactor 104 vs 139). Timeout rate 3/36 (all
        grok cfggraph). Three TERMINATION_UNCONFIRMED receipts from the host
        bash 10-minute cap killing the supervisor; workdirs still graded.
        Bindings and capability_tier unchanged. Latency-rule verdict
        at probe time: 도입 제안 (design session for latency_sensitive
        → sonnet; not implemented in this probe). Shipped in 1.3.0 as
