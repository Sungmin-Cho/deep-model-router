        claude-sonnet-5 @ high), 6 spec-dense multi-file tasks × 3 reps = 36
        dispatches under dispatch_agent.py (deadline 540s, grace 15s). Task
        types: multi-file implementation (kvtxn, cfggraph), debugging
        (journal, jobsched), tool-heavy refactor (splitpkg, ports). Grading:
        hidden pytest, task-level clean pass, suites admitted only after
