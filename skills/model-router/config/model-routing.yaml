  # Balanced-tier price with frontier-tier claims. `capability_tier: 1` is the
  # honest reading: the one head-to-head that has been run (2026-08-18, on the
  # predecessor generation) finished at the suite's ceiling and so separated
  # nothing, and raising the tier to 2 would move MEDIUM's reviewer floor — a
  # band change with nothing to do with a model generation. The sentence this
  # replaces still said no head-to-head existed, which stopped being true on
  # 2026-08-18.
  #
  # The id moved 4.6 -> 4.7 on 2026-09-22, the day grok-4.7 was observed as
  # the CLI's default model. What carries over and what does not is recorded
  # in the ledger: the effort ceiling was re-PROBED on 4.7, and the prices and
  # window were re-READ from published documentation — identical either way,
  # so the price half of the worker_balanced binding still holds. The quality
  # head-to-head was run on 4.6 and has NOT been re-run, so `capability_tier`
  # stays 1 on inherited evidence rather than a fresh measurement.
  xai_frontier:
    id: grok-4.7
    lineage: { line: xai/grok, template: "grok-{gen}", served_forms: ["{id}", "{id}-build"] }
    family: xai
    capability_tier: 1
    effort_ceiling: VERY_HIGH   # probed: the CLI rejects `max`
    verified: true
    # Tiered, unlike every other row here. Once a prompt reaches
    # `above_input_tokens`, xAI bills the ENTIRE request at the second tier —
    # not just the tokens past the line. Recording only the first tier stated
    # the half of the price that makes this seat look unconditionally cheaper
    # than the claude balanced seat, which it is not: above the line it costs
    # more on both axes. `worker_balanced_selection.prefer_alt_when_flags` is
    # the rule that acts on this; see also `context_window`.
    price_per_mtok:
      # Dated provenance like the OpenAI rows, and for the same reason: a rate
      # with no date is a rate nobody can tell is stale. It does NOT make this
      # seat quotable — `quote_cost` needs a cache_write rate and xAI publishes
      # none, only a reduced cached-input read rate. Inventing one (0.00, or a
      # copy of the input rate) would turn an absent published fact into a
      # number this file states as evidence, so the seat keeps reporting an
      # unavailable quote until xAI publishes the axis.
      verified_on: "2026-09-22"
      max_age_days: 30
      source: https://docs.x.ai/docs/models/grok-4.7
      input: 2.00
      output: 6.00
      cached_input: 0.50
      long_context: { above_input_tokens: 200000, boundary: inclusive,
                      input: 4.00, output: 12.00, cached_input: 1.00 }
    context_window: 500000

  # Retired 2026-09-22 with the grok-4.7 bump, on the rule adapters.md states
  # for exactly this case: "bump the id, re-probe, and keep the retired id as a
  # non-dispatchable history row." Valid as HISTORY input (--prior-models,
  # --unavailable-models, --host-model) so a control loop holding a 1.14.0
  # failure keeps working across the release boundary; never a candidate for
  # any seat. Same mechanism as the claude_architect history row.
  "xai_frontier@grok-4.6":
    id: grok-4.6
    history_of: xai_frontier
    family: xai
    capability_tier: 1
    effort_ceiling: VERY_HIGH
    dispatchable: false
    verified: true
    price_per_mtok:
      input: 2.00
      output: 6.00
      cached_input: 0.50
      long_context: { above_input_tokens: 200000, boundary: inclusive,
                      input: 4.00, output: 12.00, cached_input: 1.00 }
