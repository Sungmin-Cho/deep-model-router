    - item: "Implementation replay of the writing rows (2026-10-15)"
      status: verified
      probed_on: "2026-10-15"
      supersedes:
        - "claude_worker_balanced tier measurement after the claude-sonnet-5-5 bump"
      evidence: >
        Issue #65: the implementation replay references/evaluation.md describes,
        so that a writing row's tier can move when it agrees with the
        2026-10-14 review replay. Eight accepted review findings from this
        repository whose fix added a test (four in route_task, one in
        model_state, two in model_sync, one in dispatch_agent), chosen before
        any run; each subject got the pre-fix tree without history and the
        finding as its reviewer wrote it, worked at effort high through a
        write-capable headless recipe (claude -p acceptEdits; codex exec
        workspace-write) in a disposable copy, two runs each, and passed only
        if every test the real fix added passed and no pre-fix test that
        passes on both trees failed. 96 runs, all audited for reads outside
        their copy: none read an answer. Pass rates (preregistered grading):
        claude-opus-5-5 0.687500, gpt-6.1-sol 0.625000, claude-sonnet-5-5
        0.625000, claude-haiku-5-5 0.562500, gpt-6-luna 0.375000,
        gpt-5.6-terra 0.312500. The preregistered rule, against the 1.22.0
        tiers, leaving out only the row decided: a row is raised when the mean
        of the tier above sits at least 0.10 over the lowest other row of its
        tier and the row is no more than 0.05 below the lowest row of the tier
        above; lowered by the mirror clause; held otherwise. Implementation
        verdict claude-sonnet-5-5: raise. Implementation verdict
        claude-haiku-5-5: hold. Implementation verdict gpt-5.6-terra: hold.
