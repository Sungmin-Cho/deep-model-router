    - item: "Grok maker seat recipe (transports.claude_code.to_xai.mechanism_maker)"
      status: verified
      probed_on: 2026-09-01
      evidence: >
        grok 1.0.13 (5e9a58528b76) on Darwin 25.6.0 arm64, 2026-09-01.
        Argv-level escape-denial still FAILS: a hard link inside cwd
        overwrites the outside inode under a custom profile that denies
        the outside path (S6: same inode, digest changed, 0 FsViolation,
        end_turn). Built-in workspace and strict failed the same way on
        1.0.5 and 1.0.13. Supervisor-side prevention is what ships:
        (A) pre-spawn tree walk of --child-cwd refuses any regular file
        with st_nlink > 1 (S9 would have refused S6); --tools whitelist
        without run_terminal_cmd cannot create a new hard link (S8:
        Write/StrReplace create a regular file only; victim unchanged).
        (C) per-attempt GROK_HOME: workspace write grants follow
        $GROK_HOME, not ~/.grok (S4: FsViolation + EPERM on a real-home
        canary even with an explicit Write allow; ProfileApplied
        read_write_paths named the attempt home). Empty GROK_HOME does
        not log in (S1); copying auth.json onto a new inode logs in
        (S2 mode 0444 rewritten by grok to 0600 on the copy, S3 mode
        0600; source inode untouched). summary.grok_home equals the
