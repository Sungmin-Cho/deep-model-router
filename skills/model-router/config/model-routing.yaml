    - item: "worker_balanced binding: grok-4.6 over claude-sonnet-5"
      status: price_verified_quality_probed
      probed_on: 2026-08-20
      evidence: >
        PRICE: verified from published rates — grok-4.6 $2.00/$6.00 per MTok
        vs sonnet-5 $2.00/$10.00. Anthropic made Sonnet 5's $2/$10
        introductory rate permanent on 2026-08-10; the previous $3.00/$15.00
        figure was the scheduled post-intro price and is now wrong. Input is
        now equal; output remains cheaper on grok-4.6. QUALITY: probed
        2026-08-18 (see the head-to-head entry below): grok-4.6 446/446 vs
        sonnet-5 445/446 — tied at the suite's ceiling, one attempt per
        model. Repeated 2026-08-20 (6 tasks × 3 reps; see the
        worker_balanced repeat eval entry): grok 15/18 vs sonnet 15/18
        clean-pass, tied; cfggraph 0/3 both on the same
        test_absolute_entry miss; sonnet SUCCEEDED p50 lower in all
        three types. At probe time the latency-sensitive routing
        rule was a design-session candidate, not shipped; 1.3.0
        ships it as `prefer_alt_when_flags`. No quality regression
        detected against the claimed frontier tier; a single suite at
        ceiling is not grounds to raise capability_tier, which stays 1
        (raising it to 2 would move MEDIUM's reviewer floor — a band
        change). The output-price advantage holds BELOW 200K input tokens
        only; see the long-context tier entry above, which is why
        `worker_balanced_selection.prefer_alt_when_flags` exists.

    - item: "Tier 0/1 binding quality head-to-head (8 tasks, 446 hidden test nodes)"
      status: verified
      probed_on: 2026-08-18
      evidence: >
        8 spec-dense stdlib tasks (glob, jsonptr, semver, intervals,
        csvmini, wrap, debugfix, tokenbucket), each graded solely by a
        hidden pytest suite validated 100% against an independently written
        reference; 446 nodes total, one attempt per model, dispatched over
        the same CLI transports the router uses (tier-0 pair at effort
        medium, tier-1 pair at high). Scores: grok-4.6 446/446, sonnet-5
        445/446, haiku-4-5 442/446, luna 436/446. Unlike the superseded
        2026-08-11 set, 3 of 8 tasks discriminated, and the tier-1 pair
        outscored the tier-0 pair — consistent with the registry's
        capability_tier ordering. Failure modes: luna missed the long-word
        hard-break rule (wrap, 7 nodes) and trailing-comma empty fields
        (csvmini, 3); haiku accepted a trailing newline and a non-ASCII
        digit in semver (2) and split on tab in wrap (2); sonnet-5 accepted
        a non-ASCII digit in semver (1). Mean per-task wall time: luna
        19.6s, sonnet-5 38.6s, haiku 91.2s, grok-4.6 103.2s. Bindings and
        every capability_tier are unchanged by this probe.

