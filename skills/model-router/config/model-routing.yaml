  # A reviewer-only seat (design 2026-10-13): the Claude Code -> meta
  # direction has a read-only recipe and no write recipe, so the seat can
  # review and read but never fills a seat that writes. It is bound to no role.
  # Since 1.21.0 it sits SECOND in claude_code's worker_balanced fallback list,
  # after the Claude balanced model (user decision U-6), so it takes that role
  # only where neither the xai seat nor the Claude model resolves for the
  # route (withheld, failed, exhausted, outside allowed_families, the declared
  # author). The write requirement binds the whole ROLE: when the worker
  # writes from worker_balanced, the role holds the next write-capable model
  # for every seat, so this model is not a reviewer there either.
  # What seating it changes: references/model-profiles.md, "The meta reviewer
  # seat".
  #
  # `capability_tier: 0` since 1.22.0 (issue #63). The 2026-10-14 real-review
  # replay confirmed tier 1 against claude-sonnet-5, a history row; measured
  # against the lowest measured live tier-1 row (gpt-5.6-terra) by the same
  # preregistered clause, it is lowered. It keeps its place in the fallback
  # list (user decision 2026-10-15): the tier, not the list, now keeps it out
  # of review seats whose band floor asks for tier 1 or more. Its recall is
  # about a quarter of claude-sonnet-5-5's — the reason for the order above.
  # See the ledger row "Reviewer seat tiers against live anchors (real-review
  # replay, 2026-10-14)".
  meta_worker_balanced:
    id: muse-spark-1.3
    lineage: { line: meta/spark, template: "muse-spark-{gen}" }
    family: meta
    capability_tier: 0
    verified: true
    # Like the xai row: no cache-write rate is published, so `quote_cost`
