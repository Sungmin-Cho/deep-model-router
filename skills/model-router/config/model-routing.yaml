    - item: "Headless grok host authorization for the dispatch supervisor (D-14)"
      status: verified
      probed_on: "2026-09-02"
      evidence: >
        grok 1.0.13 on Darwin 25.6.0, nested headless `grok -p` turns, one
        variable changed per probe, command fixed at python3 -c 'print("PY-OK")'
        unless noted. h2 (acceptEdits): permission_resolved decision=cancelled,
        turn_ended cancellation_category=permission_cancelled. h6 (dontAsk):
        cancelled the same way -- dontAsk is documented as deny-and-continue
        but a headless ask it cannot show is a cancel. h3
        (bypassPermissions): decision=allow, stopReason end_turn, exit 0. h4
        (auto): decision=allow, end_turn, exit 0. h8 (acceptEdits plus
        --allow "Bash(python3)"): decision=allow, end_turn, exit 0. So the
        gate is command shape, not mode alone, and bypassPermissions is one
        of three modes that clear it, not the only one. Controls: h1 (bare
        echo, acceptEdits) was allowed, which is why it is not a valid
        control for python3; h7 (python, acceptEdits) was allowed by the
        host's Bash(python) allow rule and then exited 127, so the allow-list
        prefix does not reach python3; h5 (acceptEdits plus --sandbox
        workspace) never started -- grok refused to run rather than apply a
        profile it could not register.
        ACCEPTANCE, attempt acceptance/d14-supervisor-path (the directory is
        part of the citation: an earlier attempt of the same id sits at
        probes/d14-supervisor-path.json and is FAILED -- the outer host was
        sandboxed there and the child could not read the keychain. A reader
        chasing the bare id meets the failing one first): the full supervisor
        spawned a
        claude child (claude-haiku-4-5 @ low, --permission-mode acceptEdits
        --strict-mcp-config) from a grok turn and graded state SUCCEEDED,
        exit_status 0, schema_valid true, termination_confirmed true. What
        that receipt proves is the CHILD's success and nothing about the
        outer host: the effective permission mode of a grok turn is not
        observable anywhere the receipt can read, so which mode the
        controller ran under is declared, not measured. It also proves no
        containment. child_cwd was /private/tmp/d14-supervisor-made-unsandboxed
        -- a throwaway directory, not a worktree -- and
        require_single_linked_cwd was false, so the pre-spawn single-link
        audit never ran. Wrapping the outer host in the built-in workspace
        sandbox separately blocked the child's keychain (`Not logged in`,
        without --bare). This row is a host-launch record; it authorizes no
        transport and asserts no isolation. Receipts:
        docs/design/reviews/2026-09-02-grok-host-carryovers/probes/
        (h1-h8, acceptance/, d14-outer-debug.log; local, gitignored).

