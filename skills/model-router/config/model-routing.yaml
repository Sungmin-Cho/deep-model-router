    - item: "claude-print-json-v1 envelope shape (dispatch_agent --output-envelope)"
      status: verified
      probed_on: 2026-09-02
      cli_version: "2.1.258 (Claude Code)"
      attempt_id: p1-fable51-id
      argv: "claude -p --model claude-fable-5-1 --effort low --permission-mode plan --strict-mcp-config --output-format json"
      evidence: >
        The supervisor's second envelope format hard-codes a document shape, so
        the shape is recorded where a later build can be checked against it.
        Observed top-level keys on the retained capture (probes/
        p1-fable51-id.stdout, and three more in the same directory):
        type="result", subtype="success", is_error=false,
        stop_reason="end_turn", result, session_id, num_turns, usage,
        modelUsage, total_cost_usd, plus timing fields. The grader reads
        stop_reason / result / subtype and requires type=result,
        subtype=success and is_error=false; a build that stops emitting
        stop_reason fails closed as envelope_stop_reason:<absent> rather than
        passing on a null. grok documents were re-read at the same time: all 44
        retained captures carry `usage` (input_tokens,
        cache_read_input_tokens, cache_creation_input_tokens, output_tokens,
        reasoning_tokens, total_tokens), which corrects a 1.11.0 draft claim
        that the grok format carried none.

    - item: "Content certification cannot replace the artifact identity pin (won't-do)"
      status: verified
      probed_on: 2026-09-02
      evidence: >
        Designed, implemented, reviewed by two independent seats and withdrawn.
        Recorded so the next attempt starts from the measurement rather than
        the idea. The proposal was --certify-by-content: grade a required
        artifact by its declared digest instead of the inode pinned pre-spawn,
        for a seat whose file tools replace the inode (a Claude seat does).
        WHY IT FAILS. The pin is not only an authenticity control; it is what
        refuses the laundering sequence in adapters.md "Artifact paths", and
        that sequence leaves a fresh single-linked file and no trace, so no
        post-hoc check -- a digest comparison included -- can recover it. The
        implementation therefore tried to move containment earlier: refuse to
        start without the path's declared digest, --child-cwd with
        --require-single-linked-cwd, and --artifact-root inside that tree, on
        the argument that a child which cannot create a hard link, in a tree
        that contained none at spawn, has no sequence available. Both halves of
        that argument are wrong. The first is ASSUMED, not enforced: this
        supervisor never parses argv by design, so a child with a shell or an
        MCP tool reaches the weakened path exactly as the documented seat does.
        The second is bypassed by a variant needing no link at all -- write the
        expected bytes to an outside path, rename it onto the artifact path;
        the pre-spawn single-link audit says nothing about it, and under the
        pin it graded artifact_identity_replaced. The cross-device check that
        would close both (refuse a --child-cwd on the same st_dev as / or the
        home directory, so link() and rename() fail EXDEV) is not practical on
        the measured platform: on Darwin 25.6.0 /, ~, /tmp, /private/tmp, the
        repo cwd and a fresh mktemp -d all report st_dev 16777229, and a rename
        from ~ into a mktemp directory succeeds. It would demand a dedicated
        volume per attempt. STANDING GUIDANCE, unchanged: certify a Claude
        seat's output by a caller-side content hash recorded beside the
        receipt, and do not declare --require-artifact for such a seat.

    - item: "Claude child write axis (transports.codex.to_claude.write_verified, transports.grok.to_claude.write_verified)"
      status: verified
      probed_on: 2026-09-02
      host: "Claude Code 2.1.258 on Darwin 25.6.0 arm64 (argv-level; the child is
        what was measured, and a child's file tools do not depend on which host
        spawned it)"
      cli_version: "2.1.258 (Claude Code)"
      argv: "claude -p --model claude-haiku-4-5 --effort low --permission-mode acceptEdits --strict-mcp-config"
      receipts: "docs/design/reviews/2026-09-02-fable51-bridge-cost/probes/ (local, gitignored)"
      probes:
        - { attempt_id: "p5-strict-worker", outcome: INVALID_OUTPUT, note: "artifact_identity_replaced; no digest recorded" }
        - { attempt_id: "p5-strict-worker-2", outcome: INVALID_OUTPUT, note: "retry asked for the terminal tool; acceptEdits does not auto-approve it; artifact_missing" }
      evidence: >
        WRITE AXIS -- verified, by content, without a receipt. Two direct runs
        of the argv above against a pre-existing single-linked file (one with
        --strict-mcp-config, one without) each left the file containing exactly
        MADE-19. No dispatch receipt carries that: both runs were plain shell
        invocations, and the two supervised attempts listed under `probes`
        graded INVALID_OUTPUT for the reason below. Two attempts to rerun the
        supervised probe FROM a grok host on 2026-09-02 both ended
        stopReason: cancelled before the supervisor was spawned (a headless
        grok turn cancels on a permission prompt it cannot show), so no
        grok-host write receipt exists. What this row attests is therefore the
        CHILD's write axis, which is what write_verified asks about: whether
        this direction may seat write work.
        CERTIFICATION -- the same two runs installed that content on a NEW
        inode (299749070 -> 299749158 with the token; 299749197 -> 299749738
        without), so the Claude file-writing path replaces rather than
        truncates in place, and that is not a property of --strict-mcp-config.
        Only the tool that prompt drove was exercised. dispatch_agent pins one
        inode before spawn, so such an attempt grades INVALID_OUTPUT
        artifact_identity_replaced with NO digest recorded -- the receipt
        proves nothing about the content either way. The contrast is measured,
        not assumed: the same prompt through codex exec -s workspace-write kept
        its inode (see the OpenAI row), so the artifact contract is not broken
        in general and write_verified is not withdrawn here. Callers certify a
        Claude seat's output by a content hash recorded beside the receipt, and
        a workflow that needs supervisor-certified artifacts does not seat a
        Claude worker (references/adapters.md, "Dispatch contract").

    - item: "OpenAI child write axis (transports.claude_code.to_openai.write_verified, transports.grok.to_openai.write_verified)"
