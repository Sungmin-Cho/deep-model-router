        (auto): decision=allow, end_turn, exit 0. h8 (acceptEdits plus
        --allow "Bash(python3)"): decision=allow, end_turn, exit 0. So the
        gate is command shape, not mode alone, and bypassPermissions is one
        of three modes that clear it, not the only one. Controls: h1 (bare
        echo, acceptEdits) was allowed, which is why it is not a valid
        control for python3; h7 (python, acceptEdits) was allowed by the
        host's Bash(python) allow rule and then exited 127, so the allow-list
        prefix does not reach python3; h5 (acceptEdits plus --sandbox
        workspace) never started -- grok refused to run rather than apply a
        profile it could not register.
