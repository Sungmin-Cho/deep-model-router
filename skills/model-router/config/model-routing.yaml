# ---------------------------------------------------------------------------
# Role bindings
# ---------------------------------------------------------------------------
#
# One binding, not one per runtime. Roles are filled by whichever model is
# best for the job regardless of provider. Not every bridge is verified in
# every direction. Claude Code → openai, Codex → claude, Claude Code → xai,
# grok → claude, and grok → openai have been probed. Codex → xai uses the
# same command and is recorded as assumed. The per-provider bindings below
# are degraded fallbacks for when a bridge is down — not alternate defaults.

role_bindings:
  default:
    worker_fast:          openai_worker_fast       # cheapest capable volume worker
    worker_balanced:      xai_frontier             # first escalation, crosses family
    worker_balanced_alt:  claude_worker_balanced   # first-escalation fallback
    senior_engineer:      claude_senior
    reasoning_specialist: openai_reasoning         # preserve the default; frontier is the next candidate
    principal_architect:  claude_architect

  # Degraded: the codex bridge is unreachable from Claude Code.
  claude_only:
    worker_fast:          claude_worker_fast
    worker_balanced:      claude_worker_balanced
    senior_engineer:      claude_senior
    reasoning_specialist: claude_senior            # opus at MAX effort
    principal_architect:  claude_architect

  # Degraded: the claude bridge is unreachable from Codex.
  openai_only:
    worker_fast:          openai_worker_fast
    worker_balanced:      openai_worker_balanced
    senior_engineer:      openai_reasoning
    reasoning_specialist: openai_frontier
    principal_architect:  openai_frontier          # distinct from the Sol senior seat

  # Degraded: only the xAI CLI is reachable. One model fills every role, so any
  # band that requires independent review is INDEPENDENCE_UNAVAILABLE here —
  # terminal, not merely thin. That is the honest answer: there is no way to
  # run an independent review against a single model.
  xai_only:
    worker_fast:          xai_frontier
    worker_balanced:      xai_frontier
    senior_engineer:      xai_frontier
    reasoning_specialist: xai_frontier
    principal_architect:  xai_frontier

# The alt tier exists to keep an escalation path open when the bridge dies,
# not to shorten the ladder. Crossing families on the first escalation is the
# point of the first escalation.
worker_balanced_selection:
  prefer: worker_balanced
  alt:    worker_balanced_alt
  use_alt_when: worker_balanced_unavailable
  # Deterministic facts that move this binding to the alt seat. Any flag in
  # the list is enough; carrying more than one is the same swap, not a
  # conflict. Below 200K input tokens the primary seat ties on input price
  # and wins on output; at or above it, xAI re-bills the whole request at
  # $4.00/$12.00 and the primary loses on BOTH axes while running out of
  # window 500K earlier than the alt. `large_context` is the caller's
  # statement about which side of that line this route is on — the router
  # never sees a token count. `latency_sensitive` is the caller's statement
  # that first-escalation wall-clock latency outweighs output price; the
  # 2026-08-20 B.1 repeat eval tied quality 15/18 and recorded a lower
  # sonnet SUCCEEDED p50 in every task type. Neither is a quality win.
  #
  # This is a binding choice, not a fallback: the primary is available and the
  # resolver must not record it as though scarcity had struck. If the alt is
  # itself unavailable the primary comes back, and THAT is recorded.
  prefer_alt_when_flags:
    - large_context
    - latency_sensitive

# ---------------------------------------------------------------------------
# Runtime adapters
# ---------------------------------------------------------------------------

# Which runtimes this router can be asked to route for, and which
# single-provider binding survives when that runtime's cross-provider bridge
# is down. Round 21: the runtime vocabulary used to be derived from
# `effort_map`'s keys, and the degraded binding was a two-way `if` in three
# places in the script. Both are policy, so both live here.
runtimes:
  claude_code: { degraded_binding: claude_only }
  codex:       { degraded_binding: openai_only }
  grok:        { degraded_binding: xai_only }

# Conceptual effort level -> the token that family's CLI accepts.
#
# Keyed by model FAMILY, not by host runtime. The value describes what the
# TARGET model's CLI will accept; a model's own effort_map overlays its family
# map when the family has a model-specific exception. The default binding is shared across
# runtimes — so a router running under one host routinely dispatches a model
# of another family. Keying this by host meant the emitted spelling described
# a CLI that was not going to receive it.
effort_map:
  claude:
    MINIMAL:   low        # no distinct minimal tier exists; collapses to low
    LOW:       low
    MEDIUM:    medium
    HIGH:      high
    VERY_HIGH: xhigh
    MAX:       max
  openai:
    MINIMAL:   none       # verified: `minimal` is rejected, `none` is accepted
    LOW:       low
    MEDIUM:    medium
    HIGH:      high
    VERY_HIGH: xhigh
    MAX:       max
  xai:
    MINIMAL:   low        # grok has no minimal/none — reasoning cannot be disabled
    LOW:       low
    MEDIUM:    medium
    HIGH:      high
    VERY_HIGH: xhigh
    MAX:       xhigh      # unreachable: the clamp runs before this lookup and
                          # every xai model's ceiling is VERY_HIGH — the live
                          # seat and the retired row alike
  gemini:
    MINIMAL:   low
    LOW:       low
    MEDIUM:    medium
    HIGH:      high
    VERY_HIGH: high
    MAX:       high

transports:
  claude_code:
    native: { mechanism: agent_tool_subagent, isolation: context_isolation }
    to_openai:
      mechanism: "codex exec -m <id> -c model_reasoning_effort=<effort> -s <sandbox> --skip-git-repo-check \"<prompt>\""
      # The read-only REVIEWER seat (1.17.0, design 2026-09-25 DD-B9, plan B8):
      # the same argv plus --ignore-user-config --ephemeral, which cut boot input
      # 27,461 -> 19,924 tokens (-27.4%) on a paired run with the review format
      # intact. <sandbox> is read-only here. The maker seat keeps `mechanism`:
      # only the reviewer was measured. See the ledger row.
      mechanism_reviewer: "codex exec -m <id> -c model_reasoning_effort=<effort> -s <sandbox> --skip-git-repo-check --ignore-user-config --ephemeral \"<prompt>\""
      isolation: separate_process
      verified: true
      # Whether this direction may seat WRITE work. Declared, never inferred:
      # capability used to be read off the mechanism key's spelling, so renaming
      # a read-only seat's key to `mechanism` silently authorized write dispatch
      # through it. `verified` above attests the direction; this attests the
      # write seat, and Policy refuses a `true` here that the verification
      # ledger contradicts or that no write-capable recipe backs.
      write_verified: true
    to_xai:
      # Seat profiles, not one mechanism: a read-only reviewer and a
      # write-capable maker need opposite tool surfaces, and a headless
      # grok turn that meets a permission prompt it cannot show CANCELS
      # and still exits 0. See references/adapters.md "Grok seat
      # profiles" and the 2026-08-25 design (DD-4).
      #
      # Common to every seat: --output-format json (the supervisor's
      # --output-envelope grades stopReason), -s <fresh-uuid> (the same
      # value goes to --session-id, which binds the session evidence to
      # the attempt), and --prompt-file /dev/stdin. The prompt leaves
      # argv entirely: --prompt-file alone triggers headless mode
      # (probe F, [UG-14]), and the supervisor wires the prompt file to
      # the child's stdin, so there is no quoting hazard left to get
      # wrong.
      #
      # Reviewer: the tool surface IS the control, not the mode. A
      # --tools whitelist removes the terminal tool outright (g4/P-3),
      # so there is nothing to cancel the turn over; --deny closes the
      # MCP meta-tool --tools leaves behind, and a denied call returns
      # a refusal instead of killing the turn (g5). --sandbox read-only
      # completed cleanly (P-10) and is shipped as a further reduction
      # of the prompt-injection read surface.
      #
      # Maker argv is not containment by itself. Path-based sandbox still
      # cannot tell a hard link from the file it names (1.0.5 and 1.0.13).
      # Shipping this string authorizes write dispatch only when the
      # supervisor also applies --seat-profile grok-maker-v1: a disposable
      # single-linked --child-cwd, a per-attempt --grok-home seeded from
      # --grok-auth-seed, custom profile dmr-maker-v1 (fail-closed), and
      # --expect-sandbox-enforced. See adapters.md "Grok seat profiles".
      #
      # The ProfileApplied log moved: 1.0.13 wrote it at the GROK_HOME root
      # and 1.0.40 writes it under sessions/. Both are denied here because
      # the supervisor reserves and READS both — a location it grades but
      # leaves writable is a forgery channel, so the denied set and
      # dispatch_agent.SANDBOX_EVENT_RELPATHS are kept equal by test.
      # Denial of both is MEASURED, not assumed: S11 (2026-09-01) covered the
      # root path on 1.0.13, and g47-maker-forge (2026-09-22) covered both on
      # 1.0.40. The deny is a permission-policy control, not a kernel one.
      mechanism_reviewer: "grok --no-auto-update -m <id> --effort <native-effort> --output-format json -s <fresh-uuid> --permission-mode plan --tools read_file,list_dir,grep --deny MCPTool --disable-web-search --sandbox read-only --prompt-file /dev/stdin"
      mechanism_maker: "grok --no-auto-update -m <id> --effort <native-effort> --output-format json -s <fresh-uuid> --agent general-purpose --permission-mode acceptEdits --tools read_file,list_dir,grep,search_replace --disallowed-tools Agent --no-subagents --allow \"Write(./**)\" --allow \"Edit(./**)\" --deny MCPTool --deny \"Write(<grok-home>/sessions/sandbox-events.jsonl)\" --deny \"Edit(<grok-home>/sessions/sandbox-events.jsonl)\" --deny \"Write(<grok-home>/sandbox-events.jsonl)\" --deny \"Edit(<grok-home>/sandbox-events.jsonl)\" --disable-web-search --sandbox dmr-maker-v1 --prompt-file /dev/stdin"
      isolation: separate_process
      verified: true
      # Claude Code -> xAI write seat: recipe + this flag + the ledger
      # entry below. Codex -> xAI stays write_verified: false (unprobed
      # host direction).
      write_verified: true
  codex:
    native: { mechanism: multi_agent_subagent, isolation: unverified }
    to_claude:
      # 1.9.0: --strict-mcp-config (design 2026-09-02 DD-1); same argv as
      # grok.to_claude. Probed 2026-09-02 FROM a Codex host (codex exec
      # running dispatch_agent.py) — see the transports.codex.to_claude.mechanism row.
      mechanism: "claude -p --model <id> --effort <effort> --permission-mode <mode> --strict-mcp-config \"<prompt>\""
      isolation: separate_process
      verified: true
      write_verified: true
    to_xai:
      # Same argv — argv is host-independent — but `verified` stays
      # per direction: the probes ran from a Claude Code host only.
      # Seat profiles, not one mechanism: a read-only reviewer and a
      # write-capable maker need opposite tool surfaces, and a headless
      # grok turn that meets a permission prompt it cannot show CANCELS
      # and still exits 0. See references/adapters.md "Grok seat
      # profiles" and the 2026-08-25 design (DD-4).
      #
      # Common to every seat: --output-format json (the supervisor's
      # --output-envelope grades stopReason), -s <fresh-uuid> (the same
      # value goes to --session-id, which binds the session evidence to
      # the attempt), and --prompt-file /dev/stdin. The prompt leaves
      # argv entirely: --prompt-file alone triggers headless mode
      # (probe F, [UG-14]), and the supervisor wires the prompt file to
      # the child's stdin, so there is no quoting hazard left to get
      # wrong.
      #
      # Reviewer: the tool surface IS the control, not the mode. A
      # --tools whitelist removes the terminal tool outright (g4/P-3),
      # so there is nothing to cancel the turn over; --deny closes the
      # MCP meta-tool --tools leaves behind, and a denied call returns
      # a refusal instead of killing the turn (g5). --sandbox read-only
      # completed cleanly (P-10) and is shipped as a further reduction
      # of the prompt-injection read surface.
      #
      # Same maker argv as claude_code.to_xai (argv is host-independent).
      # verified and write_verified stay false: this direction was not
      # probed from a Codex host. The string is not authorization.
      mechanism_reviewer: "grok --no-auto-update -m <id> --effort <native-effort> --output-format json -s <fresh-uuid> --permission-mode plan --tools read_file,list_dir,grep --deny MCPTool --disable-web-search --sandbox read-only --prompt-file /dev/stdin"
      mechanism_maker: "grok --no-auto-update -m <id> --effort <native-effort> --output-format json -s <fresh-uuid> --agent general-purpose --permission-mode acceptEdits --tools read_file,list_dir,grep,search_replace --disallowed-tools Agent --no-subagents --allow \"Write(./**)\" --allow \"Edit(./**)\" --deny MCPTool --deny \"Write(<grok-home>/sessions/sandbox-events.jsonl)\" --deny \"Edit(<grok-home>/sessions/sandbox-events.jsonl)\" --deny \"Write(<grok-home>/sandbox-events.jsonl)\" --deny \"Edit(<grok-home>/sandbox-events.jsonl)\" --disable-web-search --sandbox dmr-maker-v1 --prompt-file /dev/stdin"
      isolation: separate_process
      verified: false
      write_verified: false
  grok:
    native: { mechanism: subagent, isolation: unverified }
    to_claude:
      # 1.9.0: carries --strict-mcp-config (design 2026-09-02 DD-1) — the
      # user-global MCP connector schemas were ~80% of a headless claude
      # seat's boot context. same argv as codex.to_claude. `verified` stays
      # per direction: probed 2026-08-29 (transport) and 2026-09-02 (this
      # string) FROM a darwin grok host — see the
      # transports.grok.to_claude.mechanism ledger row.
      mechanism: "claude -p --model <id> --effort <effort> --permission-mode <mode> --strict-mcp-config \"<prompt>\""
      # Read-only reviewer; --allowedTools is closed by --strict-mcp-config.
      mechanism_reviewer: "claude -p --model <id> --effort <effort> --permission-mode plan --allowedTools Read,Glob,Grep,LS --strict-mcp-config \"<prompt>\""
      isolation: separate_process
      verified: true
      write_verified: true
    to_openai:
      # Same per-direction rule; probed 2026-08-29 from the same darwin
      # grok host. See the "grok -> OpenAI transport" ledger entry.
      mechanism: "codex exec -m <id> -c model_reasoning_effort=<effort> -s <sandbox> --skip-git-repo-check \"<prompt>\""
      isolation: separate_process
      verified: true
      write_verified: true

# Ordered replacement candidates, consulted when a role's bound model is
# unavailable. Entries are registry keys, tried in order; the resolver skips
# any whose model is itself unavailable or identical to the one that failed,
# and falls through to the role-tier ladder when the list is exhausted.
#
# These lists were previously prose sketches with no code consumer, which is
# how five of ten (role x runtime) fallbacks became silent no-ops: the resolver
# substituted the degraded binding for the SAME role, and for those five the
# degraded binding names the same model as the default one.
fallbacks:
  claude_code:
    worker_fast:          [claude_worker_fast, claude_worker_balanced]
    worker_balanced:      [claude_worker_balanced, openai_worker_balanced, claude_senior]
    senior_engineer:      [openai_reasoning, claude_architect, openai_frontier]
    reasoning_specialist: [openai_reasoning, openai_frontier, claude_senior, claude_architect]
    principal_architect:  [openai_frontier, claude_senior, openai_reasoning]
  codex:
    worker_fast:          [openai_worker_balanced, claude_worker_fast]
    worker_balanced:      [claude_worker_balanced, openai_worker_balanced, openai_reasoning]
    senior_engineer:      [openai_reasoning, claude_senior, openai_frontier]
    reasoning_specialist: [openai_reasoning, openai_frontier, claude_senior]
    principal_architect:  [openai_frontier, openai_reasoning, claude_architect]
  grok:
    worker_fast:          [claude_worker_fast, openai_worker_balanced]
    worker_balanced:      [claude_worker_balanced, openai_worker_balanced]
    senior_engineer:      [claude_senior, openai_reasoning, openai_frontier]
    reasoning_specialist: [openai_reasoning, openai_frontier, claude_senior]
    principal_architect:  [openai_frontier, claude_architect, claude_senior]

# Compensations that apply when a fallback lands on a weaker or same-family
# model. The resolver records these; it does not silently absorb them.
# Every name here must be one `_compensations()` can actually emit — a
# compensation the config declares and no branch produces is inert policy that
# reads as active, and `test_d14_every_declared_compensation_can_actually_be_emitted`
# fails if one appears.
#
# Round 9 removed `cross_family_reviewer_lost: set_cross_family_review_false`.
# It had no branch and never needed one: `cross_family_review` is computed from
# the families of the models that were actually resolved, so losing a
# cross-family reviewer already turns it false without anyone setting it. A
# compensation for something that happens by itself is a record of a decision
# that was never made.
fallback_compensations:
  reasoning_specialist_to_same_family: raise_effort_one_level
  principal_architect_to_senior:       raise_effort_to_MAX_and_add_second_review

