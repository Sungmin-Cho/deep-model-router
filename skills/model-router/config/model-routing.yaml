    # No long-context tier: the provider states there is no premium.
    price_per_mtok:
      verified_on: "2026-10-13"
      max_age_days: 30
      source: "https://dev.meta.ai/docs/pricing-rate-limits"
      input: 1.25
      output: 4.25
      cached_input: 0.15
    context_window: 1007997

  # The gemini seat since 1.24.0 (design 2026-10-27): the same two host
  # directions, recipes and containment as the seat it replaces (the retired
  # row below), on Google's frontier model. It is a reviewer: Claude Code ships
  # a maker recipe (agy-maker-v1) whose write_verified stays false, and the
  # write requirement binds the whole role, so it never reviews where the
  # worker writes from a role it holds. Two host files contain the reviewer, an
  # agent whose tool list allows reading only and a deny-rule project
  # underneath it; the supervisor checks both, the workspace and the model
  # before the run and the CLI's log after it (references/adapters.md,
  # "Antigravity seat profile"). What seating it changes:
  # references/model-profiles.md, "The gemini reviewer seat".
  #
  # `capability_tier: 1` is measured, not read off the vendor's claims: the
  # real-review replay T5 put its recall at 0.233, between the tier-1 bar
  # (0.118) and the tier-2 bar (0.282) — ledger row "gemini_frontier tier
