# Model routing policy — the deployment artifact.
#
# This file is the single source of truth for every deterministic part of the
# router: band boundaries, overrides, worker selection, effort floors, and
# review policy. It intentionally contains NO classification logic — deciding a
# task's class, its four dimension scores, and its flags is a judgment call that
# belongs to the model, not to a config file.
#
# Concrete model identifiers of the shipped policy live here and nowhere else in
# the source or public docs. Routing logic addresses models by role alias only,
# so a model rename is a one-line change in this file. On one machine, a probed
# local overlay entry (model_sync.py, tool-written state outside the repo) may
# swap a row's id; `model_sync.py promote` is the only way back into this file.
#
# Verification status of every identifier is recorded in `verification_ledger`
# at the bottom. Keep it honest: "assumed" and "verified" must not blur.

version: 3

# ---------------------------------------------------------------------------
# Router defaults
# ---------------------------------------------------------------------------

router:
  default_worker: worker_fast
  default_orchestrator: worker_fast
  default_orchestrator_effort: HIGH

  # Bands are non-overlapping and exhaustive over 0..18. All downstream policy
  # is expressed in bands, never in raw scores — a raw-score comparison
  # anywhere else in the system is a bug.
  bands:
    LOW:      { min: 0,  max: 3,  ordinal: 0 }
    MEDIUM:   { min: 4,  max: 7,  ordinal: 1 }
    HIGH:     { min: 8,  max: 10, ordinal: 2 }
    CRITICAL: { min: 11, max: 18, ordinal: 3 }

  # risk_score = complexity + 2*uncertainty + 2*blast_radius + reversibility
  #
  # Uncertainty and blast radius are double-weighted because complexity and
  # reversibility describe what the change *is*, while uncertainty and blast
  # radius together approximate risk-adjusted expected loss — what the change
  # might *cost*.
  score_weights:
    complexity:    1
    uncertainty:   2
    blast_radius:  2
    reversibility: 1

  confidence:
    escalate_below:     0.60   # re-classify at higher effort, or ask a human
    extra_review_below: 0.80   # execute, but raise the review band one level
    # The value those two thresholds judge. Until the 2026-08-18 audit the
    # thresholds lived here and the numbers producing the value lived in
    # `routing_confidence`, so moving a threshold meant guessing at constants in
    # another file — one policy split across two sources, which this file's
    # header forbids. Confidence starts at `base` and each condition that holds
    # subtracts its penalty; the result is clamped to 0..1 and rounded to 2dp.
    base: 0.95
    penalties:
      uncertainty_3:           0.20
      uncertainty_2:           0.08
      prior_failures_2_or_more: 0.15
      prior_failures_1:        0.05
      any_fallback:            0.06   # 1.9.0: was 0.10. Feasible interval (0.05, 0.07]:
                                      # keep fb+urc (>0.15) and u3+urc+fb (>0.35)
                                      # crossing, release u2+fb (<=0.15). 0.07 sits
                                      # exactly on the `< 0.80` gate; 0.06 leaves
                                      # 0.01 on every boundary. Design 2026-09-02 DD-3.
      unknown_root_cause:      0.10
    # 1.17.0 (design 2026-09-25 DD-B2, rule C1-iii). Uncertainty already weighs
    # 2 in the risk score; when that double weight alone lifted the band (the
    # band with weight 1 is lower), the same uncertainty is not charged again
    # in the REVIEW-PROMOTION decision against `extra_review_below`. The
    # reported `routing_confidence` and `escalate_below` keep the full penalty,
    # so ESCALATE_ROUTING stays reachable; every other signal still promotes.
    skip_uncertainty_penalty_when_band_raised: true

  floors:
    # Round 9. `critical_domain_review_band: HIGH` and `critical_domain_effort:
    # HIGH` used to sit here and were read by nothing — the band floor is the
    # `critical_domain` override below, and the effort floor is
    # `effort_floors.any_critical_domain`. Two places holding one number is the
    # drift this file's header forbids, and a floor nobody reads is a promise
    # nobody keeps. Only the worker floor remains, and it IS read (as a
    # capability tier); see the note on its redundancy in route_task.py.
    critical_domain_worker:     worker_balanced

# ---------------------------------------------------------------------------
# Execution difficulty — the second axis (design 2026-09-03 DD-1)
# ---------------------------------------------------------------------------
#
# execution_score = 3*complexity + 2*uncertainty + sum(flag_weights for flags carried)
# It selects the WORKER (with `execution_selection`, below `worker_selection`)
# and floors the worker's effort. It never touches the risk band, the review,
# or the human controls: those stay a function of `router.bands` alone.
execution:
  score_weights:
    complexity:   3
    uncertainty:  2
  flag_weights:                 # EXACTLY these three context flags. Dropping one
    unfamiliar_codebase:  1     # silently restores the 1.12.1 defect (a declared
    tool_heavy:           1     # flag nobody reads), so the key set is checked
    cross_service_change: 1     # exactly, not as a subset.
  bands:
    EASY:      { min: 0,  max: 8,  ordinal: 0 }
    NORMAL:    { min: 9,  max: 11, ordinal: 1 }
    HARD:      { min: 12, max: 14, ordinal: 2 }
    VERY_HARD: { min: 15, max: 18, ordinal: 3 }

# ---------------------------------------------------------------------------
# Flags
# ---------------------------------------------------------------------------

flags:
  # Force band overrides. Any one of these makes the task at least HIGH.
  critical_domain:
    - security_sensitive
    - auth_sensitive
    - financial_sensitive
    - data_integrity_sensitive

  # Raise the band or force a specific path. Every flag listed here MUST have
  # an observable effect — a rule declared and consumed nowhere is a promise
  # the system does not keep, and `test_d6_every_declared_flag_has_an_effect`
  # fails if one goes inert.
  elevating:
    - concurrency_sensitive   # band floor MEDIUM (see overrides)
    - migration               # conditional: with data_integrity_sensitive -> CRITICAL
    - public_api_change       # band floor MEDIUM
    - production_hotfix       # band floor HIGH
    - unknown_root_cause      # effort MAX, worker promotion, confidence penalty
    - review_disagreement     # routes to the disagreement path

  # Inform decomposition and model choice, but never the band.
  context:
    - unfamiliar_codebase
    - cross_service_change
    - long_horizon
    - large_context
    - latency_sensitive   # B.1 2026-08-20: quality tie 15/18, sonnet p50 lower in every type; binds worker_balanced to alt
    - tool_heavy

  # Operational state of the runtime, not a property of the task. `bridge_down`
  # is the only supported way to select a degraded single-provider binding —
  # it used to be an undocumented string recognised in one place in the code,
  # which meant the documented route (`--unavailable <role>`) and the working
  # route were different things.
  operational:
    - bridge_down             # the cross-provider transport is unreachable
    - termination_unconfirmed # a prior write-capable attempt may still be alive

# Flags whose effect is real but only in combination with another flag. Listed
# explicitly so the "no inert elevating flag" test can tell a deliberate
# conditional from a rule nobody wired up.
conditional_flags:
  migration:
    requires: [data_integrity_sensitive]
    effect: band_exactly CRITICAL

# Applied after the band is computed, unconditionally, for every task class.
# Bands may only be raised by an override, never lowered.
#
# `when` is a small structured predicate so the code evaluates the config
# rather than reimplementing it:
#   {flag: NAME}                     the task carries NAME
#   {any_flag_in: GROUP}             the task carries any flag from flags.GROUP
#   {dimension_at_least: {DIM: N}}   that dimension scores N or higher
#   {all: [ ... ]}                   every sub-predicate holds
overrides:
  - name: critical_domain
    when: { any_flag_in: critical_domain }
    effect: { band_at_least: HIGH }

  - name: critical_irreversible
    when:
      all:
        - { any_flag_in: critical_domain }
        - { dimension_at_least: { reversibility: 2 } }
    effect: { band_exactly: CRITICAL }

  - name: migration_data_integrity
    when:
      all:
        - { flag: migration }
        - { flag: data_integrity_sensitive }
    effect: { band_exactly: CRITICAL }

  - name: production_hotfix
    when: { flag: production_hotfix }
    effect: { band_at_least: HIGH }

  - name: public_api_change
    when: { flag: public_api_change }
    effect: { band_at_least: MEDIUM }

  # Concurrency defects are subtle, poorly covered by ordinary tests, and their
  # effects are hard to undo even when the diff is easy to revert. A MEDIUM
  # floor buys one independent reviewer; it deliberately does not force HIGH,
  # because merely touching concurrent code is not the same as changing its
  # invariants — raise blast_radius for that.
  - name: concurrency_sensitive
    when: { flag: concurrency_sensitive }
    effect: { band_at_least: MEDIUM }

  - name: review_disagreement
    when: { flag: review_disagreement }
    effect: { route: disagreement }        # see review.disagreement

# ---------------------------------------------------------------------------
# Worker selection — by task class and band
# ---------------------------------------------------------------------------
#
# `reasoning_centric` picks between the two frontier roles wherever a cell
# reads `by_reasoning_centric`: true selects reasoning_specialist (the
# bottleneck is deciding WHAT is correct), false selects senior_engineer (the
# bottleneck is producing correct CODE). Default false when genuinely
# ambiguous — code-centric routing is cheaper and recovers more gracefully.

worker_selection:
  MECHANICAL:    { LOW: worker_fast,     MEDIUM: worker_fast,     HIGH: worker_balanced,       CRITICAL: senior_engineer }
  DOCUMENTATION: { LOW: worker_fast,     MEDIUM: worker_fast,     HIGH: worker_balanced,       CRITICAL: worker_balanced }
  TESTING:       { LOW: worker_fast,     MEDIUM: worker_fast,     HIGH: worker_balanced,       CRITICAL: senior_engineer }
  IMPLEMENTATION: { LOW: worker_fast,    MEDIUM: worker_fast,     HIGH: worker_balanced,       CRITICAL: by_reasoning_centric }
  REFACTORING:   { LOW: worker_fast,     MEDIUM: worker_balanced, HIGH: worker_balanced,       CRITICAL: by_reasoning_centric }
  DEBUGGING:     { LOW: worker_fast,     MEDIUM: worker_fast,     HIGH: worker_balanced,       CRITICAL: by_reasoning_centric }
  INVESTIGATION: { LOW: worker_fast,     MEDIUM: worker_balanced, HIGH: reasoning_specialist,  CRITICAL: reasoning_specialist }
  MIGRATION:     { LOW: worker_balanced, MEDIUM: worker_balanced, HIGH: senior_engineer,       CRITICAL: principal_architect }
  ARCHITECTURE:  { LOW: worker_balanced, MEDIUM: worker_balanced, HIGH: senior_engineer,       CRITICAL: principal_architect }
  REVIEW:        { LOW: worker_fast,     MEDIUM: worker_balanced, HIGH: senior_engineer,       CRITICAL: senior_engineer }
  OPERATIONS:    { LOW: worker_fast,     MEDIUM: worker_balanced, HIGH: senior_engineer,       CRITICAL: senior_engineer }

# Worker by task class and EXECUTION band. `worker_selection` above stays the
# floor: the worker is the stronger of the two cells by resolved capability
# tier, and the execution cell wins only when strictly stronger AND seating it
# does not make the review or control contract worse (design DD-2 S3-S6).
execution_selection:
  MECHANICAL:     { EASY: worker_fast,     NORMAL: worker_fast,     HARD: worker_balanced,      VERY_HARD: worker_balanced }
  DOCUMENTATION:  { EASY: worker_fast,     NORMAL: worker_fast,     HARD: worker_balanced,      VERY_HARD: worker_balanced }
  TESTING:        { EASY: worker_fast,     NORMAL: worker_fast,     HARD: worker_balanced,      VERY_HARD: worker_balanced }
  IMPLEMENTATION: { EASY: worker_fast,     NORMAL: worker_balanced, HARD: worker_balanced,      VERY_HARD: by_reasoning_centric }
  REFACTORING:    { EASY: worker_fast,     NORMAL: worker_balanced, HARD: worker_balanced,      VERY_HARD: by_reasoning_centric }
  DEBUGGING:      { EASY: worker_fast,     NORMAL: worker_balanced, HARD: worker_balanced,      VERY_HARD: by_reasoning_centric }
  INVESTIGATION:  { EASY: worker_fast,     NORMAL: worker_balanced, HARD: reasoning_specialist, VERY_HARD: reasoning_specialist }
  MIGRATION:      { EASY: worker_balanced, NORMAL: worker_balanced, HARD: senior_engineer,      VERY_HARD: senior_engineer }
  ARCHITECTURE:   { EASY: worker_balanced, NORMAL: worker_balanced, HARD: senior_engineer,      VERY_HARD: principal_architect }
  REVIEW:         { EASY: worker_fast,     NORMAL: worker_balanced, HARD: senior_engineer,      VERY_HARD: senior_engineer }
  OPERATIONS:     { EASY: worker_fast,     NORMAL: worker_balanced, HARD: worker_balanced,      VERY_HARD: senior_engineer }

# Applied after the table, before effort selection.
# Does this class's WORKER need a write-capable dispatch recipe?
#
# The router names models; the caller dispatches them. But a route that names
# a model whose transport has no write-capable seat, for work that writes, is
# not executable as written — and until this table existed the caller had to
# notice that themselves and re-route with `--unavailable-models`.
#
# Fail-closed. `read_only` is reserved for the two classes whose WORKER output
# is a judgement rather than an artifact; everything else is presumed to need a
# write-capable recipe. A class generalisation is wrong for some routes in both
# directions — an INVESTIGATION that files its report as a file, an
# IMPLEMENTATION spike that only reads — so the caller overrides it per route
# with `--worker-seat` / RouteRequestV1 `worker_seat`. What the caller must not
# have to do is discover the gap after dispatch fails.
#
# This is a routing input, not a dispatch instruction: `read_only` does not
# tell anyone to run a read-only seat, it says this route may be staffed by a
# model that only has one.
task_write_seat:
  MECHANICAL:     write
  DOCUMENTATION:  write
  TESTING:        write
  IMPLEMENTATION: write
  REFACTORING:    write
  DEBUGGING:      write
  MIGRATION:      write
  ARCHITECTURE:   write
  OPERATIONS:     write
  INVESTIGATION:  read_only
  REVIEW:         read_only

worker_promotions:
  - class: ARCHITECTURE
    when: uncertainty == 3 OR long_horizon
    to: principal_architect
  - class: DEBUGGING
    when: unknown_root_cause AND prior_failures >= 2
    to_at_least: by_reasoning_centric
  - class: INVESTIGATION
    when: unknown_root_cause
    to_at_least: worker_balanced
    note: >
      A capability, not a position: on a first attempt the balanced role is
      floored at its binding's tier (1.22.0), and the table's worker stays
      where it resolves strictly stronger than the balanced role does — an
      unknown root cause is evidence of difficulty and never weakens a route
      (1.23.0, issue #67).
  - class: MIGRATION
    when: band == CRITICAL
    note: >
      principal_architect applies to the architecture phase only; the
      implementation phase runs at worker_balanced / senior_engineer.
  - class: "*"
    when: prior_failures >= 1
    to_at_least: one_tier_above_failed_model

# Role ordering, used by every `max(worker, X)` and `one tier above` rule.
role_tiers:
  - worker_fast
  - worker_balanced
  - senior_engineer
  - reasoning_specialist
  - principal_architect

# ---------------------------------------------------------------------------
# Effort
# ---------------------------------------------------------------------------

effort_levels: [MINIMAL, LOW, MEDIUM, HIGH, VERY_HIGH, MAX]

# Every entry here is selected by `select_effort`. Round 22 removed three that
# were not: `normal_feature` (a second spelling of `straightforward_impl`),
# `difficult_debugging` (unreachable — hard debugging routes through
# `unknown_root_cause`), and `orchestration` (a second copy of
# `router.default_orchestrator_effort`). The whole subtree used to be excused as
# "guidance for the caller", which was false — the router reads it — and the
# blanket excuse is what let three dead keys sit here unseen.
effort_by_work:
  formatting_rename:        LOW
  boilerplate:              LOW
  straightforward_impl:     MEDIUM
  multi_file_feature:       HIGH
  debugging:                HIGH
  refactoring:              HIGH
  multi_system_refactoring: VERY_HIGH
  architecture:             HIGH
  complex_architecture:     MAX
  unknown_root_cause:       MAX
  standard_review:          HIGH
  adversarial_review:       MAX

# 1.17.0 (design 2026-09-25 DD-B3, rule C2): the table's effort for a task in
# this RISK band is capped here — 60% of LOW routes ran their worker at HIGH.
# Applied before the floors, so an execution floor, a local minimum or a
# compensation still wins; skipped on a retry (a capability failure on record)
# and on an unknown root cause, where the effort is doing the diagnosing.
effort_caps:
  band_LOW: MEDIUM

# Floors override the table above — never the other way round.
effort_floors:
  band_HIGH:            HIGH
  band_CRITICAL:        VERY_HIGH
  any_critical_domain:  HIGH
  execution_HARD:       HIGH        # design 2026-09-03 DD-3: worker-independent, see T3(f)
  execution_VERY_HARD:  VERY_HIGH

# ---------------------------------------------------------------------------
# Review policy — a function of BAND ONLY
# ---------------------------------------------------------------------------
#
# Review depth does not depend on which worker was selected. That independence
# is what makes the "every task reaches review selection" invariant checkable:
# no worker-selection branch can weaken the review.

review:
  # 1.17.0 (design 2026-09-25 DD-B4, rule C3, user decision U-6): LOW review is
  # the deterministic checks, not a model. Until then it was the worker's own
  # model re-reading its work in a second process (78% of LOW routes). The
  # router cannot see the checks run: exit 0 means dispatchable, and the caller
  # accepts the work only once they pass; a repository that cannot run them
  # re-routes with `availability_snapshot.checks_available: false`, which takes
  # the review to MEDIUM. So do a dispute and a caller's reviewer or
  # provider-family floor (the lowest band that can meet it). Only this band
  # may seat no reviewer, and it therefore has no effort.
  LOW:
    reviewers: []
    effort: null
    independent: false
    required_checks: [tests, lint]

  MEDIUM:
    candidates: [worker_balanced, worker_balanced_alt, senior_engineer, reasoning_specialist]
    effort: HIGH
    independent: true
    # Depth is the reviewer LIST in every other band, and MEDIUM is no
    # exception: exactly one candidate is seated. `reviewer_count: 1` and
    # `prefer_cross_family: true` sat here until the 2026-08-18 audit measured
    # them — setting the count to 3 and the preference to false produced
    # identical routes, because `select_review` seats one reviewer and prefers
    # a cross-family one unconditionally. They were not forgotten wiring; they
    # were constants wearing a config file, the shape round 17 removed from
    # `human_in_the_loop.on_retry_exhaustion`. Neither is worth making real:
    #   * a second MEDIUM reviewer is HIGH's depth at MEDIUM's price, and the
    #     way to ask for that is to raise the band — which is what bands are;
    #   * cross-family-first is the REASON this band names candidates instead
    #     of a fixed reviewer, so a key offering to turn it off is a safety
    #     property with a switch on it.
    # 1.17.0 (design 2026-09-25 DD-B5, C4): the seated reviewer is the
    # LOWEST-tier candidate that meets max(this band's floor, the implementer's
    # tier), cross-family first, ties in this list's order; with no cross-family
    # candidate at that tier a same-family one is taken (cross_family_review
    # false). `preferred_by_implementer` sat here until then and put the
    # tier-2 reasoning seat behind every tier-1 grok worker — one tier above
    # what the band asks, on a quarter of MEDIUM reviews.

  HIGH:
    reviewers: [senior_engineer, reasoning_specialist]
    effort: HIGH
    independent: true

  CRITICAL:
    reviewers: [senior_engineer, reasoning_specialist]
    effort: MAX
    independent: true
    required_checks:
      - security
      - edge_cases
      - rollback
      - test_adequacy
      - specification_compliance

  # 1.17.0 (design 2026-09-25 DD-B7, user decision U-8): a REVIEW task's lead
  # is reviewer-1 and counts toward the band's reviewers, with or without a
  # declared review_context — the lead alone at LOW and MEDIUM, lead + 1 at HIGH
  # and CRITICAL (+ judge). Until then a REVIEW task without context seated its
  # worker AND the band's reviewers: a review of a review. `dispatch_seats` is
  # the one dispatch list; source authors are excluded only when declared.
  review_class_lead_counts: true

  disagreement:
    default_judge: principal_architect
    code_local_dispute_judge: senior_engineer
    formal_reasoning_dispute_judge: reasoning_specialist
    formal_reasoning_dispute_effort: MAX
    resolution:
      # R1 / R2 -> action
      PASS+PASS:                             accept_unless_unresolved_finding
      PASS+PASS_WITH_CHANGES:                apply_then_light_rereview
      PASS_WITH_CHANGES+PASS_WITH_CHANGES:   apply_union_then_light_rereview
      PASS+FAIL:                             judge
      FAIL+PASS:                             judge
      PASS_WITH_CHANGES+FAIL:                judge_if_high_or_critical_else_reimplement
      FAIL+FAIL:                             reimplement

# ---------------------------------------------------------------------------
# Control loop
# ---------------------------------------------------------------------------

retry:
  same_model_same_effort:            1
  # Read by the router since 1.17.0 (design 2026-09-25 DD-B6, U-7): how many
  # capability failures of ONE model may still be retried on that model at a
  # higher effort before the ladder climbs a tier. With
  # `require_new_evidence_on_same_tier` below, the failure's record must carry
  # the effort it ran at and fresh `retry_evidence_sha256`.
  same_model_higher_effort:          1
  stronger_model:                    2
  max_total_implementation_attempts: 4
  max_review_rounds:                 3
  max_judge_invocations:             1
  require_new_evidence_on_same_tier: true

human_in_the_loop:
  # Exhausting the retry budget is a normal terminal state, not an error —
  # but it must surface to a human rather than fail silently.
  # `on_retry_exhaustion` was here until round 17, which measured all three of
  # its actions producing the same route: the cap is a safety limit, not a
  # policy choice, so a key offering to vary it was a constant wearing a config
  # file. The gate is unconditional in `route()`.
  # Every CRITICAL review, not only degraded ones: the router cannot verify
  # where an isolation receipt came from, so it never treats one as proof.
  on_any_critical_review:       require_human_confirmation
  on_independence_unachievable: terminal
  on_judge_unavailable:         require_human_confirmation
  # Scarcity can leave a band's review staffed below the model tier the band
  # asks for. The router cannot restore the depth; what it must not do is
  # emit the route as though the band had been satisfied. Whether a weaker
  # review is acceptable for this particular change is a judgement about the
  # change, which is a human's to make and not the router's to assume.
  # A live incident is the one case where blocking BEFORE dispatch costs more
  # than it buys. Round 20 measured it: `production_hotfix` raises the band, so
  # a hotfix got the frontier model, MAX-adjacent effort, dual independent
  # review AND a pre-dispatch human gate — the slowest, most-blocked path the
  # policy can produce, for the situation with the least time.
  #
  # The review is not the problem and does not change: depth, independence and
  # reviewer count stay exactly what the band asks. What moves is WHEN the human
  # is asked. `defer_human_confirmation` lets the fix dispatch now and records
  # that a confirmation is owed; `require_human_confirmation` blocks first, for
  # teams that would rather wait. Both are real policies, which is what makes
  # this a setting rather than a constant.
  #
  # Deferral is scoped to the band's own review gate. A route whose reviewers
  # could not be made independent, or whose review is staffed below its band,
  # still blocks — those say the review cannot be trusted, and a hotfix does
  # not make an untrustworthy review acceptable.
  on_production_hotfix:         defer_human_confirmation

  # Enforced through the CLI exit status (3), not only through a boolean in
  # the JSON: a caller that reads success as authorisation walks through a gate
  # it cannot see. Terminal states stay 1; invalid input stays 2.
  on_review_depth_reduced:      require_human_confirmation
  # A seat whose model cannot reach the effort a floor required. Same family of
  # fact as `review_depth_reduced` — the review does not run at the depth the
  # band asked for — so a hotfix does not defer it either.
  on_effort_below_floor:        require_human_confirmation
  # Unconfirmed termination is an unconditional terminal safety invariant,
  # not a configurable human action. Clear it only after termination proof.
  human_gate_exit_status:       3
  # `on_routing_confidence_below` used to sit here holding 0.60 — the same
  # number as `router.confidence.escalate_below`, which is the one the router
  # reads. Two places holding one number is the drift this file's header
  # forbids, and round 10's instrumented test proved this copy was never read.

# ---------------------------------------------------------------------------
# Model registry
# ---------------------------------------------------------------------------
#
# Every id below was probed in this environment. See verification_ledger.

models:
  # price_per_mtok is a REFERENCE record of published API rates — not the
  # marginal cost of a dispatch that rides a subscription (Claude Max /
  # ChatGPT Codex / SuperGrok). The measured evaluation consumer
  # records input/output/cache-read and OpenAI cache-write rates with explicit
  # verification dates. Missing or stale quote axes remain unavailable.
  # long_context.boundary vocabulary: `inclusive` — an input AT OR ABOVE the
  # threshold re-bills the whole request at the second tier; `exclusive` —
  # strictly above.
  #
  # `capability_tier` is the model's strength as a *model*, independent of any
  # role it happens to be bound to. Every strength comparison in the router —
  # judge-vs-party, reviewer-vs-band-floor, substitution-vs-replaced — reads
  # this, never a role's position in `role_tiers`.
  #
  # Rounds 3 through 6 of review each found the same defect wearing a new hat:
  # a decision made on a ROLE LABEL while the RESOLVED MODEL was what mattered.
  # Under scarcity a role resolves to whatever is left, so `worker_fast` can
  # hold a frontier model and `worker_balanced` a weaker one — at which point
  # role ordinals rank the assignment backwards. Peers share a tier: the two
  # frontier models are interchangeable in strength and differ only in what
  # they are good at, which `reasoning_centric` decides, not this number.
  #
  # `lineage` (every dispatchable row; design 2026-09-25 DD-A1) names the
  # vendor's id spelling across generations: `line` is globally unique,
  # `template` holds `{gen}` once and optionally a trailing `[-{date}]`, and
  # the row's own `id` must match it. Policy refuses a row that breaks any of
  # these, and two rows holding the same id. `catalog_name` (the Claude model
  # catalog's short_name) and `served_forms` (the spellings a CLI may serve the
  # id under) are read by model_sync, not by the router.
  claude_worker_fast:
    id: claude-haiku-5-5
    lineage: { line: claude/haiku, template: "claude-haiku-{gen}[-{date}]", catalog_name: Haiku }
    family: claude
    capability_tier: 0
    verified: true
    price_per_mtok:
      verified_on: "2026-10-14"
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
      input: 0.1
      output: 0.5
      cached_input: 0.01
      cache_write: 0.125
      # A request whose prompt (cache reads and writes included) is over
      # 100,000 tokens pays these rates for the whole request.
      long_context: { above_input_tokens: 100000, boundary: exclusive,
                      cache_write: 0.625,
                      input: 0.50, output: 2.50, cached_input: 0.05 }

  # History row added by `model_sync.py promote` (design 2026-09-25 DD-A3,
  # DD-A7): a superseded id of this key, valid history input, never seated.
  "claude_worker_fast@claude-haiku-4-5-20251001":
